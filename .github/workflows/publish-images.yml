name: Publish images

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  PLATFORMS: linux/amd64

jobs:
  publish:
    name: app
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Determine image name and release tag
        id: names
        run: |
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}/app" >> "$GITHUB_OUTPUT"
          echo "release_tag=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.names.outputs.image }}
          tags: |
            type=raw,value=${{ steps.names.outputs.release_tag }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: app
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

      - name: Write published image summary
        run: |
          {
            echo "### app"
            echo ""
            echo '```'
            echo "${{ steps.names.outputs.image }}@${{ steps.build.outputs.digest }}"
            echo '```'
            echo ""
            echo "Tag: \`${{ steps.names.outputs.release_tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy_live:
    name: Redeploy live stack with Komodo
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Deploy live stack
        uses: pandeptwidyaop/komodoactions@v1
        with:
          komodo-url: ${{ vars.KOMODO_STAGING_URL }}
          api-key: ${{ secrets.KOMODO_STAGING_API_KEY }}
          api-secret: ${{ secrets.KOMODO_STAGING_API_SECRET }}
          stack-name: ${{ vars.KOMODO_STAGING_STACK_NAME }}
          pull-before-deploy: true
